services:
  expo-app:
    build:
      context: ./app-recetario
      dockerfile: Dockerfile
    container_name: react_native_expo
    network_mode: "host"       # Mantiene la red transparente en Debian
    ports:
      - "8081:8081"
    volumes:
      - ./app-recetario:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    depends_on:
      - db

  backend-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nestjs_backend
    ports:
      - "3000:3000"           # Puerto típico de NestJS
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=db  
  db:
    image: postgres:latest
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: 'asgard'
      POSTGRES_PASSWORD: 'admin'
      PGDATA: /var/lib/postgres/data
    ports:
      - "5432:5432"
    volumes:
      - db_data_pg:/var/lib/postgresql/data
volumes:
  db_data_pg:
